[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
# Uniswap v4 uses transient storage, so contracts that touch it need Cancun.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
unichain_sepolia = "${UNICHAIN_SEPOLIA_RPC}"
base_sepolia = "${BASE_SEPOLIA_RPC}"
lasna = "${LASNA_RPC}"

[fmt]
line_length = 110
