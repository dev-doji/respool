[profile.default]
src = "src"
out = "out"
libs = ["lib"]
auto_detect_solc = true
test = "test"
script = "script"
# Uniswap v4 uses transient storage, so contracts that touch it need Cancun.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Deploy scripts record addresses in deployments/<chainId>.json.
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
unichain_sepolia = "${UNICHAIN_SEPOLIA_RPC}"
base_sepolia = "${BASE_SEPOLIA_RPC}"
lasna = "${LASNA_RPC}"

[fmt]
line_length = 110

[lint]
# RespoolVault only calls the trusted Uniswap v4 PoolManager and Respool's own test tokens, and every
# state change runs inside PoolManager.unlock, which cannot be re-entered. The reentrancy lints flag
# those calls generically, so they are turned off here rather than line by line.
exclude_lints = ["reentrancy-events", "reentrancy-no-eth"]
